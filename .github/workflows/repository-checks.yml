name: Research repository checks

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'fix/**'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    name: repository-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight metadata parser
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Validate research repository (without executing notebook)
        run: python scripts/check_repository.py

      - name: Compile repository utility scripts
        run: python -m compileall -q scripts
